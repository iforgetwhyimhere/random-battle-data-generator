<!DOCTYPE html>

<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Randbats Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --bg-grid: #000000;
    --surface: #000000;
    --surface-2: #000000;
    --border: #3a4266;
    --border-soft: #2a3150;
    --text: #eceffa;
    --text-dim: #b0b8d6;
    --text-faint: #8f98bd;
    --accent: #4f5fe0;
    --accent-strong: #4351c8;
    --accent-text: #a3aeff;
    --on-accent: #ffffff;
    --accent-2: #f2a65a;
    --danger: #ff8a82;
    --radius: 0;
    --radius-sm: 0;
    --mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
    --display: Arial, Helvetica, sans-serif;
    --shadow: none;
  }

  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f4fa;
    --bg-grid: #eceef7;
    --surface: #ffffff;
    --surface-2: #eef0fa;
    --border: #c9cee3;
    --border-soft: #dde1f0;
    --text: #1a1f36;
    --text-dim: #454d72;
    --text-faint: #63698c;
    --accent: #4a55d6;
    --accent-strong: #3841b8;
    --accent-text: #3a44b8;
    --on-accent: #ffffff;
    --accent-2: #9a4f08;
    --danger: #b8281f;
    --shadow: none;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
    transition: background-color .25s ease, color .25s ease;
  }

  a { color: var(--accent-text); }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 22px 60px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 22px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--border-soft);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    color: var(--on-accent);
    font-size: 15px;
    flex: none;
    box-shadow: none;
  }

  .brand h1 {
    font-size: 19px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .signal {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 0;
    background: var(--surface);
  }

  .signal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    flex: none;
  }
  .signal-dot.idle { background: var(--text-faint); }
  .signal-dot.ok {
    background: var(--accent);
    box-shadow: none;
  }
  .signal-dot.err {
    background: var(--danger);
    box-shadow: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .signal-dot.ok { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 4px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .theme-toggle button {
    all: unset;
    cursor: pointer;
    padding: 6px 11px;
    border-radius: 0;
    color: var(--text-dim);
  }
  .theme-toggle button.active {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  /* ---------- layout ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-2);
  }

  .panel-head .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .panel-head .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }

  button.role-toggle {
    all: unset;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 4px 7px;
  }
  button.role-toggle:hover { color: var(--text); border-color: var(--accent-text); }
  button.role-toggle.enabled { color: var(--accent-2); border-color: var(--accent-2); }

  textarea {
    width: 100%;
    min-height: 420px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    padding: 16px;
    flex: 1;
  }

  textarea::placeholder { color: var(--text-faint); }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--border-soft);
    gap: 10px;
  }

  .hint {
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  button.scan {
    all: unset;
    cursor: pointer;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--on-accent);
    background: var(--accent);
    padding: 10px 18px;
    border-radius: 0;
  }
  button.scan:hover { background: var(--accent-strong); }

  .outputs {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .readout {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
  }

  .stat {
    flex: 1;
    min-width: 90px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .stat .n {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-text);
  }
  .stat .l {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  pre.output {
    margin: 0;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
    overflow: auto;
    max-height: 320px;
    white-space: pre;
  }

  pre.output .placeholder { color: var(--text-faint); }

  .copy-btn {
    all: unset;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 0;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent-text); }
  .copy-btn.copied { color: var(--accent-text); border-color: var(--accent); }

  footer {
    margin-top: 34px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div>
        <h1>hey kid.</h1>
        <p>yeah, you. you want random battle sets?</p>
      </div>
    </div>
    <div class="header-right">
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button id="btnDark" class="active" type="button">Dark</button>
        <button id="btnLight" type="button">Light</button>
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <span class="label">Teambuilder export</span>
        <button class="role-toggle" id="roleToggle" type="button" aria-pressed="false">no roles: off</button>
      </div>
      <textarea id="input" spellcheck="false" placeholder=
      "paste export here"
      ></textarea>
      <div class="input-footer">
        <button class="scan" id="scanBtn" type="button">Convert</button>
      </div>
    </section>

    <section class="outputs">
      <div class="panel">
        <div class="panel-head">
          <span class="label">random-sets.json</span>
          <button class="copy-btn" data-target="out1">copy</button>
        </div>
        <pre class="output" id="out1"><span class="placeholder">Set output...</span></pre>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="label">teams.ts#getPriorityItem()</span>
          <button class="copy-btn" data-target="out2">copy</button>
        </div>
        <pre class="output" id="out2"><span class="placeholder">If you want to hardcode items, use this box</span></pre>
      </div>
    </section>
  </main>

</div>

<script>
(function () {
  "use strict";

  // ---------- theme ----------
  var root = document.documentElement;
  var btnDark = document.getElementById('btnDark');
  var btnLight = document.getElementById('btnLight');
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    btnDark.classList.toggle('active', t === 'dark');
    btnLight.classList.toggle('active', t === 'light');
  }
  btnDark.addEventListener('click', function () { setTheme('dark'); });
  btnLight.addEventListener('click', function () { setTheme('light'); });

  var roleToggle = document.getElementById('roleToggle');
  roleToggle.addEventListener('click', function () {
    allowBlankRoles = !allowBlankRoles;
    roleToggle.setAttribute('aria-pressed', String(allowBlankRoles));
    roleToggle.classList.toggle('enabled', allowBlankRoles);
    roleToggle.textContent = 'no roles: ' + (allowBlankRoles ? 'on' : 'off');
  });

  // ---------- constants ----------
  var ALLOWED_ROLES = new Set([
    '', 'Fast Attacker', 'Setup Sweeper', 'Wallbreaker', 'Tera Blast user',
    'Bulky Attacker', 'Bulky Setup', 'Fast Bulky Setup', 'Bulky Support', 'Fast Support', 'AV Pivot',
    'Doubles Fast Attacker', 'Doubles Setup Sweeper', 'Doubles Wallbreaker', 'Doubles Bulky Attacker',
    'Doubles Bulky Setup', 'Offensive Protect', 'Bulky Protect', 'Doubles Support', 'Choice Item user',
    'Z-Move user', 'Staller', 'Spinner', 'Generalist', 'Berry Sweeper', 'Thief user', 'Imprisoner',
    'Dynamax User'
  ]);
  // ^ edit if you have custom roles you need to build

  var DEFAULT_LEVEL = 80;
  var allowBlankRoles = false;

  function normalizeSpecies(s) {
    return s.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  }

  function splitList(s) {
    return s.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  function jsonArr(arr) {
    return '[' + arr.map(function (x) { return JSON.stringify(x); }).join(', ') + ']';
  }

  function esc(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  // ---------- header line parsing ----------
  // handles: SPECIES @ ITEM
  //          SPECIES (M) @ ITEM, ITEM
  //          ROLE (SPECIES) @ ITEM
  //          ROLE (SPECIES) (F) @ ITEM, ITEM
  function parseHeader(line, blockLabel) {
    var atIdx = line.indexOf(' @ ');
    var namePart, itemsPart;
    if (atIdx === -1) {
      namePart = line.trim();
      itemsPart = '';
    } else {
      namePart = line.slice(0, atIdx).trim();
      itemsPart = line.slice(atIdx + 3).trim();
    }

    // strip trailing gender marker (M) / (F)
    namePart = namePart.replace(/\s*\((M|F)\)\s*$/i, '').trim();

    var role = '';
    var species = namePart;

    var m = namePart.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
    if (m) {
      role = m[1].trim();
      species = m[2].trim();
    }

    if (!species) {
      throw new Error(blockLabel + ': could not read a species name from "' + line + '"');
    }
    if (!role && !allowBlankRoles) {
      throw new Error(blockLabel + ' (' + species + '): role name cannot be blank. (switch "no roles" on if you really want it blank.)');
    }
    if (!ALLOWED_ROLES.has(role)) {
      throw new Error(blockLabel + ' (' + species + '): "' + role + '" is not a recognized role.');
    }

    var items = itemsPart ? splitList(itemsPart) : [];
    return { species: species, role: role, items: items };
  }

  // ---------- full parse ----------
  function parseExport(raw) {
    var text = raw.replace(/\r\n/g, '\n').trim();
    if (!text) throw new Error('You didn\'t paste any sets.');

    var blocks = text.split(/\n\s*\n/).map(function (b) { return b.trim(); }).filter(Boolean);
    var speciesOrder = [];
    var speciesMap = {};
    var totalMoves = 0, totalItems = 0, totalSets = 0;

    blocks.forEach(function (block, bi) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      var blockLabel = 'Set ' + (bi + 1);

      var head = parseHeader(lines[0], blockLabel);
      var abilities = [];
      var teraTypes = [];
      var moves = [];
      var level = null;

      for (var i = 1; i < lines.length; i++) {
        var line = lines[i];
        if (line[0] === '-') {
          var mv = line.slice(1).trim();
          if (mv) moves.push(mv);
        } else if (/^Ability:/i.test(line)) {
          abilities = splitList(line.replace(/^Ability:\s*/i, ''));
        } else if (/^Tera Type:/i.test(line)) {
          teraTypes = splitList(line.replace(/^Tera Type:\s*/i, ''));
        } else if (/^Level:\s*/i.test(line)) {
          var lvl = parseInt(line.replace(/^Level:\s*/i, ''), 10);
          if (!isNaN(lvl)) level = lvl;
        } else {
          // EVs / IVs / Nature / shiny / anything else silently ignored
        }
      }

      if (level === null) level = DEFAULT_LEVEL;

      var id = normalizeSpecies(head.species);
      if (!speciesMap[id]) {
        speciesMap[id] = { level: level, displayName: head.species, sets: [] };
        speciesOrder.push(id);
      } else {
        var existing = speciesMap[id];
        if (existing.level !== level) {
          throw new Error(blockLabel + ' (' + head.species + '): level ' + level +
            ' does not match the level (' + existing.level + ') already set for this species.');
        }
        var dupe = existing.sets.some(function (s) { return s.role === head.role; });
        if (dupe) {
          throw new Error(blockLabel + ' (' + head.species + '): duplicate role "' +
            (head.role || '(none)') + '" - species can have only one set per role.');
        }
      }

      speciesMap[id].sets.push({
        role: head.role,
        movepool: moves,
        abilities: abilities,
        teraTypes: teraTypes,
        items: head.items
      });

      totalMoves += moves.length;
      totalItems += head.items.length;
      totalSets += 1;
    });

    if (!speciesOrder.length) throw new Error('No species were detected.');

    return {
      order: speciesOrder,
      map: speciesMap,
      stats: { species: speciesOrder.length, sets: totalSets, moves: totalMoves, items: totalItems }
    };
  }

  // ---------- renderers ----------
  function renderJSON(parsed) {
    var lines = ['{'];
    parsed.order.forEach(function (id, speciesIndex) {
      var data = parsed.map[id];
      lines.push('\t"' + id + '": {');
      lines.push('\t\t"level": ' + data.level + ',');
      lines.push('\t\t"sets": [');
      data.sets.forEach(function (set, i) {
        var hasAbilities = set.abilities.length > 0;
        var hasTera = set.teraTypes.length > 0;
        lines.push('\t\t\t{');
        lines.push('\t\t\t\t"role": ' + JSON.stringify(set.role) + ',');
        lines.push('\t\t\t\t"movepool": ' + jsonArr(set.movepool) + (hasAbilities || hasTera ? ',' : ''));
        if (hasAbilities) {
          lines.push('\t\t\t\t"abilities": ' + jsonArr(set.abilities) + (hasTera ? ',' : ''));
        }
        if (hasTera) {
          lines.push('\t\t\t\t"teraTypes": ' + jsonArr(set.teraTypes));
        }
        lines.push('\t\t\t}' + (i < data.sets.length - 1 ? ',' : ''));
      });
      lines.push('\t\t]');
      lines.push('\t}' + (speciesIndex < parsed.order.length - 1 ? ',' : ''));
    });
    lines.push('}');
    return lines.join('\n');
  }

  function renderPriorityItems(parsed) {
    var lines = [];
    var itemGroups = {};
    var itemOrder = [];

    // Group sets with the same single item, where possible.
    parsed.order.forEach(function (id) {
      var data = parsed.map[id];
      data.sets.forEach(function (set) {
        if (set.items.length === 1) {
          var item = set.items[0];
          if (!itemGroups[item]) {
            itemGroups[item] = [];
            itemOrder.push(item);
          }
          itemGroups[item].push({ id: id, role: set.role });
        }
      });
    });

    // Sample item pools for multi-item sets.
    parsed.order.forEach(function (id) {
      var data = parsed.map[id];
      data.sets.forEach(function (set) {
        if (set.items.length <= 1) return;

        var condition = "species.id === '" + esc(id) + "' && role === '" + esc(set.role) + "'";
        var options = set.items.map(function (item) { return "'" + esc(item) + "'"; }).join(', ');
        lines.push('if (' + condition + ') return this.sample([' + options + ']);');
      });
    });

    // Group all single-item sets that force the same item.
    itemOrder.forEach(function (item) {
      var conditions = itemGroups[item].map(function (entry) {
        return "(species.id === '" + esc(entry.id) + "' && role === '" + esc(entry.role) + "')";
      });

      if (conditions.length === 1) {
        lines.push('if ' + conditions[0] + " return '" + esc(item) + "';");
      } else {
        lines.push('if (');
        conditions.forEach(function (condition, i) {
          lines.push('\t' + condition + (i < conditions.length - 1 ? ' ||' : ''));
        });
        lines.push(") return '" + esc(item) + "';");
      }
    });

    lines.push("else return 'Life Orb';");
    return lines.join('\n');
  }

  // ---------- UI wiring ----------
  var input = document.getElementById('input');
  var out1 = document.getElementById('out1');
  var out2 = document.getElementById('out2');
  document.getElementById('scanBtn').addEventListener('click', function () {
    try {
      var parsed = parseExport(input.value);
      out1.textContent = renderJSON(parsed);
      out2.textContent = renderPriorityItems(parsed) || 'sir you forgot your items';
    } catch (err) {
      alert(err.message);
    }
  });

  document.querySelectorAll('.copy-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = document.getElementById(btn.getAttribute('data-target'));
      var text = target.textContent;
      if (!text || target.querySelector('.placeholder')) return;
      navigator.clipboard.writeText(text).then(function () {
        btn.classList.add('copied');
        var old = btn.textContent;
        btn.textContent = 'copied';
        setTimeout(function () { btn.classList.remove('copied'); btn.textContent = old; }, 1200);
      });
    });
  });

})();
</script>
</body>
</html>
